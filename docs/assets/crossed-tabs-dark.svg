<svg xmlns="http://www.w3.org/2000/svg" width="880" height="248" viewBox="0 0 880 248" role="img" aria-label="Runs where an agent saw another agent's tab, out of 6: browser-cli 0, browser-harness 6, Browser Use 4, agent-browser 6"><rect width="880" height="248" rx="12" fill="#0d1117" stroke="#3d444d"/><text x="32" y="44" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#e6edf3">Did an agent see another agent's tabs?</text><text x="32" y="68" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9198a1">Three Claude Code agents at once in one browser: runs where an agent saw another's tab, out of 6. Fewer is better.</text><text x="32" y="115" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e6edf3">browser-cli 0.2.3</text><rect x="230" y="104" width="470" height="13" rx="2" fill="#161b22"/><text x="712" y="115" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#C9A962" font-weight="600">0 / 6</text><text x="32" y="139" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9198a1">browser-harness 0.1.13</text><rect x="230" y="128" width="470" height="13" rx="2" fill="#161b22"/><rect x="230" y="128" width="470" height="13" rx="2" fill="#4d5560"/><text x="712" y="139" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#9198a1">6 / 6</text><text x="32" y="163" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9198a1">Browser Use 0.13.14</text><rect x="230" y="152" width="470" height="13" rx="2" fill="#161b22"/><rect x="230" y="152" width="313" height="13" rx="2" fill="#4d5560"/><text x="712" y="163" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#9198a1
name: release
# Pushing release/x.y.z (or -pre.n) publishes that version (it must match package.json) from main's
# tested compiled-packages artifact, with the npm-publish environment's NPM_TOKEN, then tags vX.Y.Z
# and creates the GitHub release from its CHANGELOG section (Latest, or a pre-release for -pre.n).
# `bash scripts/release.sh --confirm` pushes the branch.
on:
  push:
    branches: ['release/[0-9]*']
permissions:
  actions: read
  contents: write
  id-token: write
concurrency:
  group: release
jobs:
  publish:
    environment: npm-publish
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - run: bash scripts/release.sh --confirm
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

name: release
# Pushing release/x.y.z (or release/x.y.z-pre.n) publishes that version, which must match
# package.json, from the compiled-packages artifact of main's successful test.yml run for the
# commit: nothing is rebuilt or retested. npm auth is the npm-publish environment's NPM_TOKEN,
# read through setup-node's .npmrc. After npm, it pushes the vX.Y.Z tag and creates the GitHub
# release from that version's CHANGELOG section (Latest, or a pre-release for -pre.n).
# `bash scripts/release.sh --confirm` pushes the branch.
on:
  push:
    branches: ['release/[0-9]*']
permissions:
  actions: read
  contents: write
  id-token: write
concurrency:
  group: release
jobs:
  publish:
    environment: npm-publish
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - run: bash scripts/release.sh --confirm
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

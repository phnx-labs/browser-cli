<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-label="An agent calls the browser CLI, which drives your signed-in browsers on this machine or other machines over SSH"><rect width="880" height="330" rx="12" fill="#ffffff" stroke="#d1d9e0"/><defs><marker id="alight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker></defs><text x="32" y="40" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2328">Your agent, your browsers, any machine</text><rect x="32" y="80" width="200" height="120" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><text x="132.0" y="108" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328">Your agent</text><text x="132.0" y="130" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e">Claude Code, Codex,</text><text x="132.0" y="148" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e">any shell-using agent</text><text x="132.0" y="166" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e">reads the 4.5 KB skill</text><rect x="330" y="80" width="220" height="120" rx="10" fill="#f6f8fa" stroke="#7A6230" stroke-width="1.5"/><text x="440.0" y="108" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328">browser</text><text x="440.0" y="130" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e">native CLI, ~12 ms/command</text><text x="440.0" y="148" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e">one task per agent</text><text x="440.0" y="166" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e">refs, dialogs, iframes</text><rect x="660" y="62" width="188" height="92" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><text x="754.0" y="90" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328">This machine</text><text x="754.0" y="112" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e">Chrome, Arc, Brave, Edge,</text><text x="754.0" y="130" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e">Comet, Firefox, signed in</text><rect x="660" y="182" width="188" height="92" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1"/><text x="754.0" y="210" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328">Other machines</text><text x="754.0" y="232" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e">the same browsers,</text><text x="754.0" y="250" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e">over one kept-alive SSH link</text><line x1="232" y1="140" x2="326" y2="140" stroke="#59636e" stroke-width="1.5" marker-end="url(#alight)"/><text x="279.0" y="132.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#59636e">shell</text><line x1="550" y1="124" x2="656" y2="108" stroke="#59636e" stroke-width="1.5" marker-end="